<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#10192c" />
  <title>Stud Run — Tiny Treasure, Big Run</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
    :root{color-scheme:dark;--ink:#f4f6ef;--muted:#a9b5c5;--lime:#c8f36a;--gold:#ffca53;--panel:rgba(14,24,42,.75)}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10192c;color:var(--ink);font-family:'Space Grotesk',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
    #game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
    .vignette{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(8,15,28,.32),transparent 25%,transparent 65%,rgba(7,13,26,.42));z-index:1}
    .hud{position:fixed;inset:0;z-index:2;pointer-events:none;padding:calc(env(safe-area-inset-top) + 18px) calc(env(safe-area-inset-right) + 20px) calc(env(safe-area-inset-bottom) + 18px) calc(env(safe-area-inset-left) + 20px);display:flex;flex-direction:column;justify-content:space-between}
    .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.brand{font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#dce7ed}.brand b{color:var(--lime)}
    .stats{display:flex;gap:9px}.stat{min-width:76px;padding:9px 13px;border:1px solid rgba(220,238,244,.14);border-radius:13px;background:var(--panel);backdrop-filter:blur(12px);text-align:right;box-shadow:0 8px 26px #050b1640}.stat small{display:block;font:10px 'DM Mono',monospace;letter-spacing:.12em;color:#9daec0;text-transform:uppercase}.stat strong{display:block;margin-top:3px;font-size:19px;line-height:1;color:#fff}.stat.gold strong{color:var(--gold)}
    .bottom{display:flex;justify-content:space-between;align-items:flex-end}.hint{font:10px 'DM Mono',monospace;letter-spacing:.12em;color:#c5d3d9;text-shadow:0 2px 6px #000;opacity:.8}.controls{display:flex;gap:10px;align-items:flex-end;pointer-events:auto}.control{height:56px;min-width:56px;border:1px solid #d5f7c346;border-radius:17px;background:#15253bce;color:#f5f8ee;backdrop-filter:blur(12px);font:500 20px 'Space Grotesk',sans-serif;box-shadow:0 8px 24px #040b1770;touch-action:none}.control:active{transform:translateY(2px);background:#304551}.control.jump{min-width:76px;height:68px;border-color:#ffe08b65;color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.12em}.control.jump span{display:block;font-size:21px;margin-bottom:1px}
    .overlay{position:fixed;inset:0;z-index:4;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 45%,rgba(10,18,33,.06),rgba(8,14,27,.56));transition:opacity .25s,visibility .25s}.overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}.card{width:min(440px,100%);padding:34px 32px 28px;border:1px solid rgba(218,239,244,.19);border-radius:27px;background:linear-gradient(145deg,rgba(23,39,59,.93),rgba(12,21,38,.91));box-shadow:0 28px 90px #0308169c;backdrop-filter:blur(18px);text-align:center}.eyebrow{font:11px 'DM Mono',monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--lime)}h1{font-size:clamp(42px,11vw,62px);letter-spacing:-.075em;line-height:.9;margin:17px 0 12px;text-transform:uppercase}h1 em{font-style:normal;color:var(--gold)}.desc{max-width:320px;margin:0 auto;color:#b9c5d3;font-size:14px;line-height:1.55}.features{display:flex;justify-content:center;gap:16px;margin:24px 0 25px;color:#d7e1e4;font:10px 'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase}.features span{display:flex;align-items:center;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime)}.dot.gold{background:var(--gold);box-shadow:0 0 10px var(--gold)}.dot.pink{background:#ff728f;box-shadow:0 0 10px #ff728f}
    .start{width:100%;height:56px;border:0;border-radius:15px;background:var(--lime);color:#152116;font:700 13px 'Space Grotesk',sans-serif;letter-spacing:.16em;text-transform:uppercase;box-shadow:0 8px 28px #b6e8653b}.start:active{transform:translateY(1px);filter:brightness(.94)}.foot{margin-top:17px;color:#8f9eae;font:10px 'DM Mono',monospace;letter-spacing:.1em}.result{font:500 14px 'DM Mono',monospace;color:#c8d1d9;margin:18px 0 22px}.result strong{color:var(--gold);font-size:25px;display:block;margin-top:8px}.toast{position:fixed;z-index:3;top:calc(env(safe-area-inset-top) + 90px);left:50%;transform:translate(-50%,-8px);padding:8px 13px;border-radius:20px;background:#ffd267;color:#31220c;font:700 11px 'DM Mono',monospace;letter-spacing:.1em;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:600px){.hud{padding-left:14px;padding-right:14px}.stats{gap:6px}.stat{min-width:65px;padding:8px 10px;border-radius:11px}.stat strong{font-size:17px}.brand{font-size:10px;margin-top:5px}.hint{display:none}.bottom{justify-content:center}.control{height:54px;min-width:58px}.control.jump{height:64px;min-width:74px}.card{padding:30px 24px 24px}.features{gap:10px;font-size:9px}}
    @media(orientation:landscape) and (max-height:520px){.hud{padding-top:10px;padding-bottom:10px}.topbar{align-items:center}.brand{font-size:10px}.stat{padding:6px 10px}.stat strong{font-size:16px}.control{height:46px}.control.jump{height:54px}.card{width:min(560px,90vw);padding:20px 26px}.card h1{font-size:42px;margin:10px}.features{margin:12px}.desc{font-size:12px}.start{height:46px}.foot{margin-top:10px}}
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"}}</script>
</head>
<body>
  <div id="game"></div><div class="vignette"></div>
  <div class="hud">
    <div class="topbar"><div class="brand">✦ &nbsp; <b>STUD</b> RUN</div><div class="stats"><div class="stat gold"><small>Studs</small><strong id="studCount">000</strong></div><div class="stat"><small>Distance</small><strong id="distance">0m</strong></div><div class="stat"><small>Best</small><strong id="best">0m</strong></div></div></div>
    <div class="bottom"><div class="hint">← → CHANGE LANE &nbsp; · &nbsp; SPACE TO JUMP</div><div class="controls"><button class="control" id="left" aria-label="Move left">‹</button><button class="control jump" id="jump"><span>↑</span>JUMP</button><button class="control" id="right" aria-label="Move right">›</button></div></div>
  </div>
  <div class="toast" id="toast">+1 STUD</div>
  <div class="overlay" id="overlay"><section class="card"><div class="eyebrow">A pocket-sized 3D runner</div><h1>Stud <em>Run</em></h1><p class="desc" id="message">Dash the neon track, scoop up golden studs, and leap over the blocks. How far can you go?</p><div class="features"><span><i class="dot gold"></i>COLLECT</span><span><i class="dot"></i>SWERVE</span><span><i class="dot pink"></i>JUMP</span></div><button class="start" id="start">Start running&nbsp; →</button><div class="foot" id="foot">TOUCH BUTTONS OR SWIPE TO MOVE</div></section></div>
  <script type="module" src="./game.js"></script>
</body>
</html>
